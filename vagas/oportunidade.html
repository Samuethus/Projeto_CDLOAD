<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vagas abertas · CDL Cuiabá</title>
<meta name="description" content="Vagas abertas oferecidas pelos associados da CDL Cuiabá.">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* Paleta e tipografia da página inicial de vagas (vagas.html). */
  :root{
    color-scheme: light;
    --azul-royal:#0050A2;
    --azul-petroleo:#007794;
    --verde-esmeralda:#00B16D;
    --branco:#ffffff;

    --sidebar-bg:#022b53;

    --text-dark:#161B22;
    --text-muted:#6b6f76;
    --bg-card:#F7F7F8;
    --borda:#E6EBF2;

    --gradiente:linear-gradient(135deg,var(--azul-royal) 0%,var(--azul-petroleo) 55%,var(--verde-esmeralda) 100%);

    /* Tokens da seção Campanhas do app (index.html). */
    --wa-bg:#F8FAFC;
    --wa-card:#FFFFFF;
    --wa-border:#E2E8F0;
    --wa-text:#0F172A;
    --wa-text-muted:#64748B;
    --wa-primary:#2563EB;
    --wa-primary-hover:#1D4ED8;
    --wa-primary-soft:#EFF6FF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--branco);
    color:var(--text-dark);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  .container{width:min(1180px,100% - 32px); margin-inline:auto;}

  /* ---------- Botões (cabeçalho) ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:48px; padding:0 24px; border-radius:12px; font:600 14.5px 'Inter',sans-serif;
    border:1px solid transparent; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-contorno{background:#fff; color:var(--text-dark); border-color:#D5DBE3;}
  .btn-contorno:hover{border-color:var(--azul-royal); color:var(--azul-royal);}

  /* ---------- Logos NIM | CDL Cuiabá (mesmos recortes do vagas.html) ---------- */
  .logo-nim{display:block; overflow:hidden; height:var(--h,34px); width:calc(var(--h,34px) * var(--ar) * .47);}
  .logo-nim img{height:100%; width:auto; max-width:none; display:block;}
  .logo-cor{--ar:6.747;}
  .marca{--h:36px; display:flex; align-items:center; gap:16px;}
  .marca .logo-nim{width:calc(var(--h) * var(--ar) * .4196);}
  .marca-barra{width:2px; height:calc(var(--h) * .9); border-radius:2px; background:var(--azul-royal);}
  .logo-cdl{display:block; overflow:hidden; height:var(--h); width:calc(var(--h) * var(--ar) * .375);}
  .logo-cdl img{height:100%; width:auto; max-width:none; display:block; margin-left:calc(var(--h) * var(--ar) * -.5964);}

  /* ---------- Cabeçalho (igual ao do vagas.html) ---------- */
  .topo{position:sticky; top:0; z-index:50; padding:14px 0; background:var(--branco); transition:background .2s ease, box-shadow .2s ease;}
  .topo.rolou{background:rgba(255,255,255,.86); backdrop-filter:blur(12px); box-shadow:0 1px 0 var(--borda);}
  .topo .container{display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .menu{
    display:flex; gap:4px; padding:6px; background:#fff; border:1px solid var(--borda);
    border-radius:14px; box-shadow:0 6px 18px -12px rgba(2,43,83,.25);
  }
  .menu a{padding:8px 16px; border-radius:10px; font-size:14px; color:#38404b; font-weight:500;}
  .menu a:hover{background:var(--bg-card); color:var(--azul-royal);}
  .topo-acoes{display:flex; align-items:center; gap:18px;}
  .topo-acoes .link{font-size:14px; font-weight:500; color:#38404b;}
  .topo-acoes .link:hover{color:var(--azul-royal);}
  .topo-acoes .btn{height:42px; padding:0 20px; border-radius:12px;}

  /* ===================================================================
     Seção replicada de Campanhas (index.html), em tela cheia: sem o menu
     lateral e sem o cabeçalho do app. Barra de filtros mantida até a
     consolidação dos filtros; tabela vazia até o novo banco de dados.
  =================================================================== */
  .pagina{background:var(--wa-bg); min-height:calc(100vh - 72px); padding:30px 34px 48px;}
  .pagina svg{fill:none; stroke:currentColor;}

  .filter-bar{
    display:flex; align-items:center; flex-wrap:nowrap; column-gap:10px;
    box-sizing:border-box; height:58px; min-height:58px; padding:10px 14px; margin-bottom:20px;
    background:var(--branco); border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.06);
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-select{
    appearance:none; -webkit-appearance:none;
    background:#f4f4f4 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>') no-repeat right 10px center;
    background-size:13px; border:none; border-radius:8px; padding:9px 30px 9px 12px;
    font-family:inherit; font-size:13px; color:var(--text-dark); cursor:pointer;
    min-width:72px; flex:1 1 0;
  }
  .filter-divider{width:1px; align-self:stretch; background:#e2e2e2; margin:0 2px;}
  .filter-spacer{flex:1;}
  .filter-bar :is(.wa-btn, .filter-divider, .wa-view-toggle){flex:0 0 auto;}

  .wa-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:10px;
    font-family:inherit; font-size:13.5px; font-weight:600;
    border:1px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .wa-btn svg{width:15px; height:15px; stroke-width:2;}
  .wa-btn-primary{background:var(--wa-primary); color:#fff;}
  .wa-btn-primary:hover{background:var(--wa-primary-hover);}
  .wa-icon-btn{padding:6px; border-radius:8px; background:transparent; border:none; color:var(--wa-text-muted); cursor:pointer; display:inline-flex;}

  .wa-view-toggle{
    display:flex; align-items:center; gap:4px;
    background:var(--wa-bg); border:1px solid var(--wa-border); border-radius:10px; padding:2px;
  }
  .wa-view-toggle-btn{
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:8px; border:none; background:transparent;
    color:var(--wa-text-muted); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .2s ease-in-out; white-space:nowrap;
  }
  .wa-view-toggle-btn svg{width:14px; height:14px; stroke-width:2;}
  .wa-view-toggle-btn.active{background:var(--wa-card); color:var(--wa-primary); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .wa-view-toggle-btn:hover:not(.active){color:var(--wa-text);}

  .wa-card{background:var(--wa-card); border:1px solid var(--wa-border); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .wa-table-wrap{overflow-x:auto;}
  .wa-table{width:100%; border-collapse:collapse; text-align:left; font-size:13px; color:var(--wa-text-muted);}
  .wa-table td{padding:14px 20px;}
  .wa-empty-row td{padding:36px 20px; text-align:center; color:#94a3b8; font-size:13px;}

  /* Calendário (carrossel com 2 meses lado a lado), sem eventos por enquanto. */
  .wa-cal-carousel-card{padding:16px; overflow:visible;}
  .wa-cal-carousel{display:flex; align-items:center; gap:10px;}
  .wa-cal-nav{
    flex:0 0 auto; background:var(--wa-card); border:1px solid var(--wa-border); border-radius:10px;
    padding:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); position:sticky; top:88px; z-index:2;
  }
  .wa-cal-nav svg{width:18px; height:18px; stroke-width:2.4;}
  .wa-cal-months{display:flex; flex:1; gap:24px; min-width:0; align-items:stretch;}
  .wa-cal-month-panel{
    flex:1 1 0; min-width:0; display:flex; flex-direction:column;
    border:1px solid #EEF2F6; border-radius:10px; overflow:hidden;
  }
  .wa-cal-header{display:flex; align-items:center; justify-content:center; padding:14px 16px; border-bottom:1px solid var(--wa-border);}
  .wa-cal-title{font-size:14px; font-weight:700; color:var(--wa-text); text-transform:capitalize;}
  .wa-cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--wa-border);}
  .wa-cal-weekdays span{padding:10px 6px; text-align:center; font-size:11px; font-weight:700; color:var(--wa-text-muted); text-transform:uppercase;}
  .wa-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; align-items:stretch; flex:1;}
  .wa-cal-cell{min-height:96px; border-right:1px solid #EEF2F6; border-bottom:1px solid #EEF2F6; padding:6px; display:flex; flex-direction:column; gap:4px;}
  .wa-cal-cell-muted{background:#FAFBFC;}
  .wa-cal-cell-today{background:var(--wa-primary-soft);}
  .wa-cal-daynum{font-size:11.5px; font-weight:700; color:var(--wa-text-muted);}

  /* ---------- Responsivo ---------- */
  @media (max-width:1024px){
    .menu{display:none;}
  }
  @media (max-width:900px){
    .wa-cal-months{gap:12px;}
    .wa-cal-cell{min-height:56px; padding:4px;}
    .wa-cal-daynum{font-size:10px;}
    .wa-cal-title{font-size:12px;}
    .wa-cal-header{padding:10px 8px;}
    .wa-cal-weekdays span{font-size:9px; padding:6px 2px;}
    .wa-cal-nav{padding:6px;}
    .wa-cal-nav svg{width:14px; height:14px;}
  }
  @media (max-width:768px){
    .pagina{padding:18px 16px 40px;}
  }
  @media (max-width:640px){
    .marca{--h:26px; gap:12px;}
    .topo-acoes .link{display:none;}
    .wa-cal-cell{min-height:46px; padding:2px;}
  }
</style>
</head>

<script>
  // Cabeçalho com fundo ao rolar
  const topo = document.getElementById('topo');
  const marcarTopo = () => topo.classList.toggle('rolou', window.scrollY > 10);
  window.addEventListener('scroll', marcarTopo, { passive: true });
  marcarTopo();

  // Alternador Tabela / Calendário e calendário de 2 meses (vazio até o novo banco de dados).
  (() => {
    const tabela = document.getElementById('vagasTableView');
    const calendario = document.getElementById('vagasCalendarView');
    const meses = document.getElementById('vagasCalMonths');
    const hoje = new Date();
    let calDate = new Date(hoje.getFullYear(), hoje.getMonth(), 1);

    const rotuloMes = d => {
      const nome = d.toLocaleDateString('pt-BR', { month: 'long' });
      return `${nome.charAt(0).toUpperCase() + nome.slice(1)} - ${d.getFullYear()}`;
    };
    // Sempre 6 semanas (42 células): os dois painéis ficam com a mesma altura.
    const painelMes = (ano, mes) => {
      const inicio = new Date(ano, mes, 1).getDay();
      const dias = new Date(ano, mes + 1, 0).getDate();
      let celulas = '';
      for (let i = 0; i < 42; i++) {
        const dia = i - inicio + 1;
        if (dia < 1 || dia > dias) { celulas += '<div class="wa-cal-cell wa-cal-cell-muted"></div>'; continue; }
        const ehHoje = ano === hoje.getFullYear() && mes === hoje.getMonth() && dia === hoje.getDate();
        celulas += `<div class="wa-cal-cell${ehHoje ? ' wa-cal-cell-today' : ''}"><div class="wa-cal-daynum">${dia}</div></div>`;
      }
      return `<div class="wa-cal-month-panel">
        <div class="wa-cal-header"><div class="wa-cal-title">${rotuloMes(new Date(ano, mes, 1))}</div></div>
        <div class="wa-cal-weekdays"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
        <div class="wa-cal-grid">${celulas}</div>
      </div>`;
    };
    const desenhar = () => {
      const prox = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1);
      meses.innerHTML = painelMes(calDate.getFullYear(), calDate.getMonth()) + painelMes(prox.getFullYear(), prox.getMonth());
    };
    const mover = n => { calDate = new Date(calDate.getFullYear(), calDate.getMonth() + n, 1); desenhar(); };
    document.getElementById('vagasCalPrev').addEventListener('click', () => mover(-1));
    document.getElementById('vagasCalNext').addEventListener('click', () => mover(1));

    const botoes = document.querySelectorAll('#vagasViewToggle .wa-view-toggle-btn');
    botoes.forEach(btn => btn.addEventListener('click', () => {
      const cal = btn.dataset.view === 'calendar';
      botoes.forEach(b => b.classList.toggle('active', b === btn));
      tabela.hidden = cal;
      calendario.hidden = !cal;
      if (cal) desenhar();
    }));
  })();
</script>
</body>
</html>
