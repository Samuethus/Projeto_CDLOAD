# Atualiza diariamente os dados do Panorama Econômico (ABVE e Novo CAGED).
# Roda scripts/abve_extrair.py e scripts/caged_extrair.py e só faz commit (e novo deploy)
# se alguma das fontes publicou algo novo.
name: Atualizar dados (ABVE e CAGED)

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC (06:00 em Cuiabá), uma vez por dia
  workflow_dispatch:       # também dá para rodar manualmente na aba Actions

permissions:
  contents: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extrair dados da ABVE
        run: python scripts/abve_extrair.py
      - name: Extrair dados do Novo CAGED
        run: python scripts/caged_extrair.py
      - name: Commit e deploy se houve mudança
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain assets/data/abve_frotas.js assets/data/caged_dados.js)" ]; then
            git config user.name "abve-bot"
            git config user.email "abve-bot@users.noreply.github.com"
            git add assets/data/abve_frotas.js assets/data/caged_dados.js
            git commit -m "Dados ABVE/CAGED: atualização diária"
            git push
            # Commits feitos pelo GITHUB_TOKEN não disparam o deploy sozinhos.
            gh workflow run deploy.yml
          else
            echo "Sem mudanças."
          fi
