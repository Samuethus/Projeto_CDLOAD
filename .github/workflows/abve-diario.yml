# Atualiza diariamente os dados do Panorama Econômico (ABVE e Novo CAGED) e dos painéis Sefaz MT (ICMS), IBGE (IPCA-15 e PMC)
# e Stone (Índice do Varejo Stone). Roda scripts/abve_extrair.py, scripts/caged_extrair.py, scripts/sefaz_extrair.ps1,
# scripts/ibge_extrair.ps1 e scripts/stone_ivs_extrair.py e só faz
# commit (e novo deploy) se alguma das fontes publicou algo novo.
name: Atualizar dados (ABVE, CAGED, Sefaz MT, IBGE e Stone)

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC (06:00 em Cuiabá), uma vez por dia
  workflow_dispatch:       # também dá para rodar manualmente na aba Actions
  push:                    # e quando os scripts do CNPJ mudam (regera a base e o mapa por CEP na hora)
    branches: [main]
    paths:
      - scripts/cnpj_extrair.py
      - scripts/cnpj_ceps_geo.py

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extrair dados da ABVE
        run: python scripts/abve_extrair.py
      - name: Extrair dados do Novo CAGED
        run: python scripts/caged_extrair.py
      # Looker Studio público da Sefaz MT. Se a Sefaz refizer o relatório, este passo falha
      # sem apagar os dados anteriores e sem impedir a atualização de ABVE e CAGED.
      - name: Extrair dados da Sefaz MT (ICMS)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/sefaz_extrair.ps1
      # SIDRA/IBGE: IPCA-15 e PMC (mesmos números das publicações mensais). Falha sem bloquear os demais.
      - name: Extrair dados do IBGE (IPCA-15 e PMC)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ibge_extrair.ps1
      # SIDRA/IBGE: PNAD Contínua (mensal por trimestre móvel + desocupação trimestral por UF). Falha sem bloquear os demais.
      - name: Extrair dados do IBGE (PNAD Contínua)
        continue-on-error: true
        run: python scripts/ibge_pnad_extrair.py
      # Stone: CSV público da edição mais recente do Índice do Varejo (divulgação mensal). Falha sem bloquear os demais.
      - name: Extrair dados da Stone (Índice do Varejo Stone)
        continue-on-error: true
        run: python scripts/stone_ivs_extrair.py
      - name: Extrair dados da Cielo (ICVA)
        continue-on-error: true
        run: python scripts/cielo_icva_extrair.py
      # Receita Federal: dados abertos do CNPJ (~7 GB por edição mensal: Estabelecimentos, Empresas e Simples).
      # Consulta só a lista de pastas e sai na hora quando a edição mais recente já foi processada; falha sem
      # bloquear os demais. Prazo largo: o servidor da Receita às vezes fica lento (~1 MB/s).
      - name: Extrair dados do CNPJ (Receita Federal)
        continue-on-error: true
        timeout-minutes: 300
        env:
          CNPJ_TMP: ${{ runner.temp }}/cnpj
        run: python scripts/cnpj_extrair.py
      # Mapa de empresas (EMPRESAS > Mapa): coordenadas dos CEPs de Mato Grosso que ainda faltam no cache
      # (AwesomeAPI/BrasilAPI), um lote por dia; sem coordenada, o CEP fica na sede do município.
      - name: Coordenadas dos CEPs (mapa de empresas)
        continue-on-error: true
        timeout-minutes: 60
        run: python scripts/cnpj_ceps_geo.py
      - name: Commit e deploy se houve mudança
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARQS="assets/data/abve_frotas.js assets/data/caged_dados.js assets/data/caged_relatorio.js assets/data/sefaz_icms.js assets/data/ibge_ipca15.js assets/data/ibge_pmc.js assets/data/stone_ivs.js assets/data/cielo_icva.js assets/data/ibge_pnad.js assets/data/cnpj_empresas.js assets/data/cnpj_ceps.js scripts/cache/ceps_geo.csv"
          if [ -n "$(git status --porcelain $ARQS)" ]; then
            git config user.name "abve-bot"
            git config user.email "abve-bot@users.noreply.github.com"
            git add $(ls $ARQS 2>/dev/null)   # só os que existem (cnpj_ceps.js e o cache surgem na 1ª extração)
            git commit -m "Dados ABVE/CAGED/Sefaz/IBGE/Stone: atualização diária"
            git push
            # Commits feitos pelo GITHUB_TOKEN não disparam o deploy sozinhos.
            gh workflow run deploy.yml
          else
            echo "Sem mudanças."
          fi
