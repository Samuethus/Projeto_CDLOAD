<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DATALOAD · Cenas dos vídeos curtos</title>
<!-- Gerador dos vídeos demonstrativos (1080x1920, até 20 s) de landing/videos curtos/.
     Interface redesenhada com dados FICTÍCIOS e marca DATALOAD (sem nenhuma referência à entidade real).
     Cada quadro é desenhado por renderFrame(t) — determinístico, para o render.cjs capturar quadro a quadro.
     Abra no navegador com ?v=<id>&play=1 para pré-visualizar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545; --side:#0A2A57; --azul:#1D5FD3; --azul2:#A9C8F5; --azulbg:#E8F0FD; --verde:#4FA845; --verdebg:#E7F5E4;
    --verm:#E5484D; --vermbg:#FDECEC; --amar:#E3AE1F; --amarbg:#FDF4DC; --txt:#0F172A; --sub:#64748B; --borda:#E6EBF2; --fundo:#F4F6FA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#D3D7DE;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--txt)}
  #stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#E9EBEF 0%,#D6DAE1 60%,#C9CED7 100%)}
  /* Janela (coordenadas lógicas 1280 x 904: barra do navegador 44 + app 860) */
  #cam{position:absolute;left:0;top:0;width:1280px;height:904px;transform-origin:0 0}
  #win{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(15,23,42,.28),0 8px 24px rgba(15,23,42,.12)}
  .chrome{position:absolute;left:0;top:0;right:0;height:44px;background:#EEF1F5;border-bottom:1px solid #E1E5EB;display:flex;align-items:center;padding:0 16px}
  .chrome i{width:12px;height:12px;border-radius:50%;margin-right:8px;display:inline-block}
  .url{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:300px;height:26px;border-radius:8px;background:#fff;font-size:13px;color:#64748B;display:flex;align-items:center;justify-content:center;gap:6px}
  .side{position:absolute;left:0;top:44px;bottom:0;width:210px;background:var(--side);color:#C9D6EA;padding:18px 14px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .logo b{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--side);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:-.5px}
  .logo span{font-weight:800;color:#fff;font-size:16px;letter-spacing:.5px;line-height:1.1}
  .logo small{display:block;font-weight:500;color:#8FB0E0;font-size:10px;letter-spacing:.2px}
  .nav{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border-radius:9px;margin-bottom:3px;font-weight:500}
  .nav i{width:15px;height:15px;border-radius:5px;border:2px solid currentColor;opacity:.75}
  .nav.on{background:var(--azul);color:#fff}
  .head{position:absolute;left:210px;right:0;top:44px;height:70px;padding:16px 26px;border-bottom:1px solid var(--borda);background:#fff}
  .head h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .head p{font-size:12.5px;color:var(--sub);margin-top:3px}
  .head .user{position:absolute;right:24px;top:18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
  .head .user b{width:32px;height:32px;border-radius:50%;background:var(--azulbg);color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:12px}
  .content{position:absolute;left:210px;top:114px;width:1070px;height:790px;background:var(--fundo);overflow:hidden}
  .lay{position:absolute;inset:0;padding:20px 24px}
  .modal-bg{position:absolute;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden}
  .mh{padding:18px 22px;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px}
  .mh .ic{width:38px;height:38px;border-radius:10px;background:var(--azulbg);color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:800}
  .mh h3{font-size:16px} .mh p{font-size:12px;color:var(--sub);margin-top:2px}
  .mb{padding:20px 22px} .mf{padding:14px 22px;border-top:1px solid var(--borda);display:flex;justify-content:flex-end;gap:10px;background:#F8FAFC}
  /* componentes */
  .bar{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:16px}
  .busca{flex:0 0 230px;height:36px;border-radius:9px;background:#F1F3F6;display:flex;align-items:center;padding:0 12px;font-size:12.5px;color:#94A3B8;gap:8px}
  .busca.on{color:var(--txt);box-shadow:0 0 0 2px var(--azul) inset;background:#fff}
  .chip{height:36px;border-radius:9px;background:#F1F3F6;padding:0 13px;display:flex;align-items:center;font-size:12.5px;color:#475569;white-space:nowrap;font-weight:500}
  .chip.sel{background:var(--azulbg);color:var(--azul);font-weight:600}
  .btn{height:36px;border-radius:9px;padding:0 15px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:#E9ECF1;color:#334155;white-space:nowrap}
  .btn.pri{background:var(--azul);color:#fff} .btn.ok{background:var(--verde);color:#fff}
  .sp{flex:1}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:16px 18px;position:relative;overflow:hidden}
  .card h4{font-size:13.5px;font-weight:700} .card .cs{font-size:11.5px;color:var(--sub);margin-top:2px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .kpi .l{font-size:12.5px;font-weight:600;color:#334155}
  .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:6px}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:4px}
  .up{color:var(--verde)} .dn{color:var(--verm)} .az{color:var(--azul)}
  .badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:600}
  .b-ok{background:var(--verdebg);color:#2F8A26} .b-az{background:var(--azulbg);color:var(--azul)} .b-am{background:var(--amarbg);color:#A87A07} .b-ve{background:var(--vermbg);color:#C53035} .b-ci{background:#EEF1F5;color:#64748B}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#64748B;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--borda)}
  td{padding:11px 12px;border-bottom:1px solid #F0F2F6;color:#334155}
  .cursor{position:absolute;width:28px;height:28px;pointer-events:none;z-index:50}
  .ring{position:absolute;border-radius:50%;border:3px solid var(--azul);pointer-events:none;z-index:49}
  .toast{position:absolute;left:50%;translate:-50% 0;bottom:28px;white-space:nowrap;background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.25)}
  .toast i{width:22px;height:22px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
  .field{margin-bottom:14px} .field label{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
  .inp{height:40px;border-radius:9px;background:#F4F5F7;padding:0 12px;display:flex;align-items:center;font-size:13.5px;color:var(--txt)}
  .inp.on{box-shadow:0 0 0 2px var(--azul) inset;background:#fff}
  .steps{display:flex;gap:8px;margin-bottom:18px}
  .steps span{flex:1;height:6px;border-radius:3px;background:#E3E8EF} .steps span.on{background:var(--azul)}
  .chk{width:18px;height:18px;border-radius:5px;border:2px solid #CBD5E1;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:0 0 auto}
  .chk.on{background:var(--azul);border-color:var(--azul)}
  .sw{width:40px;height:22px;border-radius:11px;background:#CBD5E1;position:relative;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:none}
  .sw.on{background:var(--azul)} .sw.on::after{left:21px}
  /* sobreposições do palco */
  #topo{position:absolute;left:0;right:0;top:0;height:540px;background:linear-gradient(#E3E6EB 0%,#E3E6EB 70%,#E3E6EB00 100%);padding:120px 80px 0}
  #base{position:absolute;left:0;right:0;bottom:0;height:380px;background:linear-gradient(#CDD2DA00 0%,#CDD2DAEE 45%,#CDD2DA 100%)}
  .marca{display:flex;align-items:center;gap:16px}
  .marca b{width:64px;height:64px;border-radius:18px;background:var(--navy);color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;letter-spacing:-.5px}
  .marca span{font-weight:800;font-size:30px;letter-spacing:3px;color:var(--navy)}
  #tit{font-size:76px;font-weight:800;letter-spacing:-2px;color:var(--navy);margin-top:44px;line-height:1.02}
  #sub{font-size:32px;color:#475569;margin-top:16px;font-weight:500;line-height:1.3}
  #pill{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:38px;font-weight:700;padding:22px 40px;border-radius:60px;white-space:nowrap;box-shadow:0 18px 40px rgba(11,37,69,.3)}
  #dots{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);display:flex;gap:12px}
  #dots i{width:12px;height:12px;border-radius:6px;background:#9AA6B8} #dots i.on{width:40px;background:var(--navy)}
  #fim{position:absolute;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  #fim b{width:150px;height:150px;border-radius:40px;background:#fff;color:var(--navy);font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
  #fim h2{font-size:96px;font-weight:800;letter-spacing:6px;margin-top:46px}
  #fim p{font-size:34px;color:#8FB0E0;margin-top:18px;font-weight:600}
  #fim small{position:absolute;bottom:170px;font-size:30px;color:#C9D6EA;font-weight:500}
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><div id="win"></div></div>
  <div id="topo"><div class="marca"><b>DL</b><span>DATALOAD</span></div><div id="tit"></div><div id="sub"></div></div>
  <div id="base"></div>
  <div id="pill"></div>
  <div id="dots"></div>
  <div id="fim"><b>DL</b><h2>DATALOAD</h2><p>Inteligência de dados para decisões</p><small id="fimsec"></small></div>
</div>
<script>
// ======================================================================= utilitários
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;   // ease in-out cúbico
const eout = p => 1 - Math.pow(1 - p, 3);
const prog = (t, a, b) => eout(clamp((t - a) / (b - a)));                     // 0→1 entre a e b
const fmt = (v, c = 0) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
const cnt = (v, p, c = 0) => fmt(v * p, c);
const typed = (txt, t, a, cps = 14) => txt.slice(0, Math.max(0, Math.floor((t - a) * cps)));
const caret = t => (Math.floor(t * 2.4) % 2 ? '' : '<span style="display:inline-block;width:2px;height:16px;background:#1D5FD3;margin-left:1px;vertical-align:middle"></span>');
const NAV = ['Home', 'Dashboard', 'Clipping News', 'Relatórios', 'Banco de dados', 'Pesquisas', 'WhatsApp', 'Campanhas', 'Usuários', 'Inadimplência', 'Estoque'];
const MES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

// Barras verticais (valores 0..max), crescendo com p; destaque nas últimas `hi` barras.
function barras(vals, w, h, p, hi = 3, cor = '#1D5FD3', claro = '#A9C8F5', rot = MES) {
  const max = Math.max(...vals) * 1.08, n = vals.length, gap = w / n, bw = gap * .62;
  let s = `<svg width="${w}" height="${h + 22}" viewBox="0 0 ${w} ${h + 22}">`;
  for (let k = 0; k < 4; k++) s += `<line x1="0" x2="${w}" y1="${h * k / 4}" y2="${h * k / 4}" stroke="#EEF1F5"/>`;
  vals.forEach((v, i) => {
    const pp = clamp(p * 1.6 - i * .05), bh = v / max * h * eout(pp);
    s += `<rect x="${i * gap + (gap - bw) / 2}" y="${h - bh}" width="${bw}" height="${bh}" rx="5" fill="${i >= n - hi ? cor : claro}"/>`;
    if (rot) s += `<text x="${i * gap + gap / 2}" y="${h + 16}" font-size="10.5" fill="#94A3B8" text-anchor="middle">${rot[i % rot.length]}</text>`;
  });
  return s + '</svg>';
}
// Barras horizontais com rótulo e valor.
function hbarras(itens, w, p, cor = '#1D5FD3') {
  const max = Math.max(...itens.map(i => i[1]));
  return itens.map(([n, v, c], i) => `<div style="display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12px">
    <span style="width:120px;color:#475569">${n}</span>
    <span style="flex:1;height:14px;background:#F1F3F6;border-radius:7px;overflow:hidden"><span style="display:block;height:100%;width:${v / max * 100 * eout(clamp(p * 1.4 - i * .08))}%;background:${c || cor};border-radius:7px"></span></span>
    <b style="width:52px;text-align:right;color:#0F172A">${fmt(v * eout(clamp(p * 1.4 - i * .08)), 1)}%</b></div>`).join('');
}
// Rosca: segs = [[valor, cor]], desenhada com p.
function rosca(segs, size, p, centro = '', sub = '') {
  const r = size / 2 - 14, c = 2 * Math.PI * r, tot = segs.reduce((a, s) => a + s[0], 0);
  let acc = 0, s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">`;
  s += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#F1F3F6" stroke-width="26"/>`;
  segs.forEach(([v, cor]) => {
    const len = v / tot * c * eout(p);
    s += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${cor}" stroke-width="26" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-acc * eout(p)}"/>`;
    acc += v / tot * c;
  });
  s += '</svg>';
  return `<div style="position:relative;width:${size}px;height:${size}px">${s}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:${size / 7}px">${centro}</b><span style="font-size:11px;color:#64748B">${sub}</span></div></div>`;
}
// Linhas (séries [{v:[], cor}]) desenhadas progressivamente.
function linhas(series, w, h, p, rot) {
  const all = series.flatMap(s => s.v), max = Math.max(...all) * 1.1, min = Math.min(0, ...all);
  let s = `<svg width="${w}" height="${h + 20}" viewBox="0 0 ${w} ${h + 20}">`;
  for (let k = 0; k < 4; k++) s += `<line x1="0" x2="${w}" y1="${h * k / 4}" y2="${h * k / 4}" stroke="#EEF1F5"/>`;
  series.forEach(se => {
    const n = se.v.length, pts = se.v.map((v, i) => [i / (n - 1) * w, h - (v - min) / (max - min) * h]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < n; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2; d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
    s += `<path d="${d}" fill="none" stroke="${se.cor}" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - eout(p)}"/>`;
  });
  if (rot) rot.forEach((r, i) => { s += `<text x="${i / (rot.length - 1) * w}" y="${h + 16}" font-size="10.5" fill="#94A3B8" text-anchor="${i === 0 ? 'start' : i === rot.length - 1 ? 'end' : 'middle'}">${r}</text>`; });
  return s + '</svg>';
}
const kpi = (l, v, d, cls, cor = '') => `<div class="card kpi"><div class="l">${l}</div><div class="v" style="${cor ? 'color:' + cor : ''}">${v}</div><div class="d ${cls}">${d}</div></div>`;
const ico = (txt, bg, fg) => `<span style="width:34px;height:34px;border-radius:9px;background:${bg};color:${fg};display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 auto">${txt}</span>`;
const pop = (t, a, d = .35) => { const p = prog(t, a, a + d); return `opacity:${p};transform:translateY(${(1 - p) * 18}px) scale(${.96 + .04 * p})`; };

// ======================================================================= vídeos
// Cada vídeo: titulo, sub, nav (índice no menu), cenas [{d, cap, head:[título, descrição], view(t), cam:[[t, zoom, fx, fy]], cur:[[t, x, y, clique?]]}]
// Coordenadas fx/fy/x/y na janela lógica (1280 x 904): conteúdo começa em x 210, y 114.
const X0 = 210, Y0 = 114;
const VIDEOS = {};

// ---------------------------------------------------------------- 01 · Home
(() => {
  const tiles = [['Painel de Indicadores', 'b'], ['Radar de Mercado', 'b'], ['Pesquisas', 'b'], ['Gestão à Vista', 'g'], ['Observatório de Obras', 'b'], ['Ofícios', 'b'], ['Relatório Mensal', 'b'], ['Certificado Digital', 'g']];
  const grid = (t, opt = {}) => `<div class="lay"><h2 style="font-size:22px;letter-spacing:-.4px">Bem-vindo ao DATALOAD</h2><p style="font-size:13px;color:#64748B;margin:4px 0 18px">Acesse os painéis e módulos liberados para o seu perfil.</p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">${tiles.map(([n, c], i) => {
      const lock = opt.lock && [2, 5, 7].includes(i), hov = opt.hover === i;
      return `<div class="card" style="padding:0;${pop(t, .1 + i * .08)};${hov ? 'box-shadow:0 16px 36px rgba(29,95,211,.28);outline:3px solid #1D5FD3;' : ''}${lock ? 'opacity:' + (1 - .55 * opt.lock) : ''}">
        <div style="height:120px;background:linear-gradient(135deg,${c === 'g' ? '#2E7D32,#66BB6A' : '#0B3A82,#2F6FDB'});display:flex;align-items:flex-end;padding:16px;gap:6px">${[38, 58, 30, 70, 50].map(h => `<span style="width:12px;height:${h}%;background:#fff;opacity:.9;border-radius:3px"></span>`).join('')}
        ${lock ? `<span style="margin-left:auto;background:#fff;color:#0B2545;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;opacity:${opt.lock}">🔒 Sem acesso</span>` : ''}</div>
        <div style="padding:14px 16px"><b style="font-size:14px">${n}</b><div style="font-size:11.5px;color:#64748B;margin-top:3px">Painel interativo · atualizado hoje</div></div></div>`;
    }).join('')}</div></div>`;
  const embed = t => `<div class="lay" style="padding:0"><div style="position:absolute;inset:0;background:#fff;${pop(t, 0, .45)}">
    <div style="padding:16px 24px;border-bottom:1px solid #E6EBF2;display:flex;align-items:center;gap:12px"><span class="btn">← Voltar</span><b style="font-size:16px">Radar de Mercado</b><span class="badge b-ok">Ao vivo</span></div>
    <div style="padding:20px 24px;display:grid;grid-template-columns:2fr 1fr;gap:16px">
      <div class="card"><h4>Faturamento do varejo · índice</h4><div class="cs">Base fictícia · 2026</div><div style="margin-top:12px">${linhas([{ v: [40, 46, 44, 52, 58, 55, 63, 70, 68, 76, 82, 88], cor: '#1D5FD3' }, { v: [30, 34, 33, 38, 40, 43, 45, 47, 50, 53, 55, 58], cor: '#4FA845' }], 600, 250, prog(t, .3, 1.8), MES)}</div></div>
      <div class="card"><h4>Participação por setor</h4><div style="display:flex;justify-content:center;margin-top:18px">${rosca([[46, '#1D5FD3'], [28, '#4FA845'], [26, '#A9C8F5']], 210, prog(t, .4, 1.6), '46%', 'Varejo')}</div></div>
    </div></div></div>`;
  VIDEOS.home = { titulo: 'Home', sub: 'Todos os módulos da plataforma em uma tela inicial.', nav: 0, cenas: [

const ORDEM = ['home', 'dashboard', 'clipping', 'relatorios', 'banco', 'pesquisas', 'whatsapp', 'campanhas', 'usuarios', 'inadimplencia', 'estoque'];

// ======================================================================= motor
const INTRO = 1.4, FIM = 2.3;
const q = new URLSearchParams(location.search);
const V = VIDEOS[q.get('v') || 'dashboard'];
let ac = INTRO; V.cenas.forEach(c => { c.t0 = ac; ac += c.d; });
const CORPO = ac, DUR = +(CORPO + FIM).toFixed(2);
// Câmera e cursor: chaves globais (início do vídeo = visão geral). Zoom com fx 640 mira o centro do conteúdo (x 745).
const KC = [[0, 1, 640, 452]], KU = [];
V.cenas.forEach(c => { (c.cam || []).forEach(k => KC.push([c.t0 + k[0], k[1], k[2] === 640 && k[1] > 1.05 ? 745 : k[2], k[3]])); (c.cur || []).forEach(k => KU.push([c.t0 + k[0], k[1], k[2], k[3], c])); });
KC.sort((a, b) => a[0] - b[0]);
function interp(K, t) {
  if (t <= K[0][0]) return K[0];
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const a = K[i - 1], b = K[i], p = eio((t - a[0]) / Math.max(.001, b[0] - a[0])); return [t, lerp(a[1], b[1], p), lerp(a[2], b[2], p), lerp(a[3], b[3], p)]; }
  return K[K.length - 1];
}
const S0 = 990 / 1280, CXS = 540, CYS = 1030;
const $ = id => document.getElementById(id);
$('tit').textContent = V.titulo; $('sub').textContent = V.sub; $('fimsec').textContent = V.titulo;
$('dots').innerHTML = V.cenas.map(() => '<i></i>').join('');

function shell(c, t) {
  return `<div class="chrome"><i style="background:#FF6058"></i><i style="background:#FFBD2E"></i><i style="background:#28CA42"></i><div class="url">🔒 dataload.app</div></div>
  <div class="side"><div class="logo"><b>DL</b><span>DATALOAD<small>Inteligência de dados</small></span></div>${NAV.map((n, i) => `<div class="nav ${i === V.nav ? 'on' : ''}"><i></i>${n}</div>`).join('')}</div>
  <div class="head"><h1>${c.head[0]}</h1><p>${c.head[1]}</p><div class="user">Usuário Demo <b>UD</b></div></div>
  <div class="content">${c.view(t)}</div>`;
}
function cursorHtml(t) {
  if (!KU.length) return '';
  // só durante a cena dona das chaves
  const cena = V.cenas.find(c => t >= c.t0 && t < c.t0 + c.d);
  const ks = KU.filter(k => k[4] === cena);
  if (!ks.length) return '';
  let x = ks[0][1], y = ks[0][2];
  for (let i = 1; i < ks.length; i++) { if (t >= ks[i][0]) { x = ks[i][1]; y = ks[i][2]; } else { const a = ks[i - 1], p = eio(clamp((t - a[0]) / (ks[i][0] - a[0]))); x = lerp(a[1], ks[i][1], p); y = lerp(a[2], ks[i][2], p); break; } }
  let s = '';
  ks.filter(k => k[3]).forEach(k => { const dt = t - k[0]; if (dt >= 0 && dt < .5) { const r = 10 + dt * 70; s += `<div class="ring" style="left:${k[1] - r}px;top:${k[2] - r}px;width:${2 * r}px;height:${2 * r}px;opacity:${1 - dt / .5}"></div>`; } });
  const ap = clamp((t - cena.t0) / .25) * clamp((cena.t0 + cena.d - t) / .2);
  return s + `<svg class="cursor" style="left:${x - 4}px;top:${y - 2}px;opacity:${ap}" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#0F172A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
window.DURACAO = DUR;
window.renderFrame = function (t) {
  const i = Math.max(0, V.cenas.findIndex(c => t < c.t0 + c.d));
  const ci = t >= CORPO ? V.cenas.length - 1 : (t < INTRO ? 0 : i);
  const c = V.cenas[ci], lt = Math.max(0, t - c.t0);
  let html = shell(c, Math.min(lt, c.d));
  // transição entre cenas: a anterior some por cima
  if (ci > 0 && lt < .35) { const a = V.cenas[ci - 1]; html += `<div style="position:absolute;inset:0;opacity:${1 - eout(lt / .35)}">${shell(a, a.d)}</div>`; }
  html += cursorHtml(t);
  $('win').innerHTML = html;
  // câmera
  const [, z, fx, fy] = interp(KC, Math.min(t, CORPO));
  const k = S0 * z, ip = eout(clamp(t / INTRO));
  const rot = (1 - ip) * 38, esc = .78 + .22 * ip;
  $('cam').style.transform = `translate(${CXS - fx * k}px,${CYS - fy * k}px) translate(${fx * k}px,${fy * k}px) perspective(1600px) rotateX(${rot}deg) scale(${esc}) translate(${-fx * k}px,${-fy * k}px) scale(${k})`;
  $('cam').style.opacity = clamp(t / .5);
  // textos do palco
  const ti = prog(t, .2, .9);
  $('topo').style.opacity = ti; $('topo').style.transform = `translateY(${(1 - ti) * -30}px)`;
  const pa = clamp((lt - .15) / .3) * clamp((c.d - lt) / .25);
  $('pill').textContent = c.cap; $('pill').style.opacity = t < INTRO ? 0 : pa; $('pill').style.transform = `translateX(-50%) translateY(${(1 - pa) * 24}px)`;
  [...$('dots').children].forEach((d, j) => d.className = j === ci && t >= INTRO ? 'on' : '');
  $('dots').style.opacity = t < INTRO ? prog(t, .6, 1.2) : 1;
  // encerramento
  const f = prog(t, CORPO, CORPO + .6);
  $('fim').style.opacity = f; $('fim').style.transform = `scale(${1.08 - .08 * f})`;
  $('fim').style.display = f > 0 ? 'flex' : 'none';
};
renderFrame(0);
if (q.get('play')) { const t0 = performance.now(); (function loop() { const t = ((performance.now() - t0) / 1000) % DUR; renderFrame(t); requestAnimationFrame(loop); })(); }
</script>
